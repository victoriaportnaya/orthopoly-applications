[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orthopoly-applications"
version = "0.1.1"
description = "Practical orthogonal polynomial and Weyl orbit tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]
benchmark = ["scikit-learn>=1.4", "networkx>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]
